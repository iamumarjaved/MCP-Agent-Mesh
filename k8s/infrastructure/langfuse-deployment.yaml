---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: langfuse
    tier: infrastructure
    version: "2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-mesh
      component: langfuse
  template:
    metadata:
      labels:
        app: agent-mesh
        component: langfuse
        tier: infrastructure
        version: "2.0"
    spec:
      containers:
        - name: langfuse
          image: langfuse/langfuse:2
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: database-url
            - name: NEXTAUTH_URL
              value: "http://langfuse:3000"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: nextauth-secret
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: salt
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: langfuse
    tier: infrastructure
spec:
  type: ClusterIP
  selector:
    app: agent-mesh
    component: langfuse
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
