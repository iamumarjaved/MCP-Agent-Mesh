---
# Redis for local/dev environments. Production uses Azure Redis Cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: redis
    tier: infrastructure
    version: "7.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-mesh
      component: redis
  template:
    metadata:
      labels:
        app: agent-mesh
        component: redis
        tier: infrastructure
        version: "7.2"
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          args:
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: redis
    tier: infrastructure
spec:
  type: ClusterIP
  selector:
    app: agent-mesh
    component: redis
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
