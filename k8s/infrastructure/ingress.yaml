---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-mesh-ingress
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-rps: "50"
spec:
  tls:
    - hosts:
        - api.agent-mesh.example.com
        - dashboard.agent-mesh.example.com
      secretName: agent-mesh-tls
  rules:
    - host: api.agent-mesh.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8000
    - host: dashboard.agent-mesh.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: presentation
                port:
                  number: 8004
