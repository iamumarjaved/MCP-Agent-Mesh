---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-engine-mcp
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: compute-engine-mcp
    tier: mcp-server
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-mesh
      component: compute-engine-mcp
  template:
    metadata:
      labels:
        app: agent-mesh
        component: compute-engine-mcp
        tier: mcp-server
        version: "1.0.0"
    spec:
      serviceAccountName: default
      containers:
        - name: compute-engine-mcp
          image: ${ACR_LOGIN_SERVER}/agent-mesh-compute-engine-mcp:latest
          ports:
            - containerPort: 9001
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agent-mesh-config
          env:
            - name: SERVICE_NAME
              value: "compute-engine-mcp"
            - name: SERVICE_PORT
              value: "9001"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-mesh-secrets
                  key: redis-password
                  optional: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
      nodeSelector:
        nodepool: workload
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: compute-engine-mcp
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: compute-engine-mcp
    tier: mcp-server
spec:
  type: ClusterIP
  selector:
    app: agent-mesh
    component: compute-engine-mcp
  ports:
    - port: 9001
      targetPort: http
      protocol: TCP
      name: http
