---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: data-ingestion
    tier: agent
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-mesh
      component: data-ingestion
  template:
    metadata:
      labels:
        app: agent-mesh
        component: data-ingestion
        tier: agent
        version: "1.0.0"
    spec:
      serviceAccountName: default
      containers:
        - name: data-ingestion
          image: ${ACR_LOGIN_SERVER}/agent-mesh-data-ingestion:latest
          ports:
            - containerPort: 8001
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agent-mesh-config
          env:
            - name: SERVICE_NAME
              value: "data-ingestion"
            - name: SERVICE_PORT
              value: "8001"
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-mesh-secrets
                  key: azure-openai-api-key
            - name: COSMOS_DB_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-mesh-secrets
                  key: cosmos-db-key
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-mesh-secrets
                  key: redis-password
                  optional: true
            - name: STORAGE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-mesh-secrets
                  key: storage-account-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      nodeSelector:
        nodepool: workload
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: data-ingestion
    tier: agent
spec:
  type: ClusterIP
  selector:
    app: agent-mesh
    component: data-ingestion
  ports:
    - port: 8001
      targetPort: http
      protocol: TCP
      name: http
