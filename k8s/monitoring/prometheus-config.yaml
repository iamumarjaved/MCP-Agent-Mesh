---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agent-mesh
  labels:
    app: agent-mesh
    component: prometheus
    tier: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # Agent services
      - job_name: "agent-mesh-agents"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - agent-mesh
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_tier]
            regex: agent
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: /metrics
        scheme: http

      # MCP servers
      - job_name: "agent-mesh-mcp-servers"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - agent-mesh
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_tier]
            regex: mcp-server
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: /metrics
        scheme: http

      # Infrastructure
      - job_name: "agent-mesh-infrastructure"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - agent-mesh
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_tier]
            regex: infrastructure
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metrics_path: /metrics
        scheme: http

      # Kubernetes API server
      - job_name: "kubernetes-apiservers"
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_namespace,
                __meta_kubernetes_service_name,
                __meta_kubernetes_endpoint_port_name,
              ]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: "kubernetes-nodes"
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
