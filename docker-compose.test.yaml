version: "3.9"

# Slimmed-down compose file for CI / integration testing.
# Omits Langfuse, dashboard, and MCP servers -- only the services
# required by the test suite are included.

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file: .env.test
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      ENV: test
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
      - ./data:/app/data
      - ./workflows:/app/workflows

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

networks:
  default:
    name: agent-mesh-test-network
