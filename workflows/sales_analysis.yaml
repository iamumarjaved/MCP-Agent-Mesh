name: sales_analysis
description: >
  End-to-end sales data analysis pipeline. Ingests raw sales data,
  profiles quality, runs descriptive statistics and trend analysis,
  detects anomalies, retrieves industry benchmarks for context,
  generates narrative insights, and compiles a comprehensive report.
version: "1.0"

triggers:
  - keywords:
      - sales
      - revenue
      - quarterly
      - q4
      - performance
      - top products
      - regional sales

steps:
  # Phase 1: Data Ingestion & Preparation
  - id: ingest
    agent: data-ingestion-v1
    action: ingest_and_clean
    params:
      source: data/sample/sales_q4_2025.csv
      cleaning_operations:
        - dedup
        - impute
    depends_on: []
    timeout: "60s"
    retry: 3

  - id: profile
    agent: data-ingestion-v1
    action: profile_data
    params: {}
    depends_on:
      - ingest
    timeout: "30s"
    retry: 2

  # Phase 2: Analysis
  - id: statistics
    agent: analytics-v1
    action: run_statistics
    params:
      columns:
        - revenue
        - units_sold
        - discount
    depends_on:
      - ingest
    timeout: "2m"
    retry: 3

  - id: trends
    agent: analytics-v1
    action: analyze_trends
    params:
      date_column: date
      value_column: revenue
      period: weekly
    depends_on:
      - ingest
    timeout: "2m"
    retry: 2

  - id: anomalies
    agent: analytics-v1
    action: detect_anomalies
    params:
      column: revenue
      method: zscore
      threshold: 2.5
    depends_on:
      - ingest
    timeout: "2m"
    retry: 2

  - id: regional_breakdown
    agent: analytics-v1
    action: aggregate_by_dimension
    params:
      group_by: region
      agg_func: sum
    depends_on:
      - ingest
    timeout: "1m"
    retry: 2

  # Phase 3: Context Enrichment
  - id: benchmarks
    agent: insight-generator-v1
    action: retrieve_benchmarks
    params:
      source: data/sample/industry_benchmarks.json
      metrics:
        - revenue_growth_yoy
        - gross_margin
        - customer_retention
    depends_on: []
    timeout: "1m"
    retry: 2

  # Phase 4: Insight Generation
  - id: insights
    agent: insight-generator-v1
    action: generate_insights
    params:
      focus_areas:
        - product_performance
        - regional_trends
        - anomaly_explanations
        - benchmark_comparison
    depends_on:
      - statistics
      - trends
      - anomalies
      - regional_breakdown
      - benchmarks
    timeout: "3m"
    retry: 2

  # Phase 5: Report Compilation
  - id: charts
    agent: presentation-v1
    action: generate_charts
    params:
      chart_types:
        - revenue_by_region_bar
        - revenue_trend_line
        - product_mix_pie
        - anomaly_scatter
    depends_on:
      - statistics
      - trends
      - anomalies
    timeout: "2m"
    retry: 2

  - id: report
    agent: presentation-v1
    action: compile_report
    params:
      format: html
      sections:
        - executive_summary
        - data_quality
        - descriptive_statistics
        - trend_analysis
        - anomaly_detection
        - benchmark_comparison
        - insights_and_recommendations
    depends_on:
      - profile
      - statistics
      - trends
      - anomalies
      - insights
      - charts
    timeout: "3m"
    retry: 2
    on_fail: skip_and_deliver_partial

approval_gates:
  - after: insights
    condition: "quality_score < 0.7"
  - after: report
    condition: "quality_score < 0.8"

notifications:
  on_complete: webhook
  on_approval_needed: email
